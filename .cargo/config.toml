# Dependency cooldown (Cargo 1.100+): the resolver ignores crate versions
# published less than seven days ago unless they are already in Cargo.lock.
# A compromised crate is usually yanked within days of publication, so a
# fresh malicious release never reaches a build from this tree. Covers every
# crate under this repository (linux/, android/droid, android/interop).
# For an urgent fix that needs a newer version, override for that one crate:
#   cargo update -p <crate> --precise <version> \
#       --config 'resolver.incompatible-publish-age="allow"'
# `cargo install` ignores this setting.
[registry]
global-min-publish-age = "7 days"
