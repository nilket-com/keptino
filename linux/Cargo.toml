[package]
name = "keptino"
version = "0.2.1"
edition = "2024"
resolver = "3"
authors = ["nilket.com"]
description = "A password vault by nilket."

[package.metadata.deb]
maintainer = "nilket.com"
copyright = "2026, nilket.com"
license-file = ["../LICENSE", "0"]
provides = "digisafe"
conflicts = "digisafe"
replaces = "digisafe"
assets = [
    ["target/release/keptino", "/usr/bin/keptino", "755"],
    ["debian/digisafe", "/usr/bin/digisafe", "755"],
    ["keptino.png", "/usr/share/pixmaps/keptino.png", "644"],
    ["keptino.desktop", "/usr/share/applications/keptino.desktop", "644"],
]
depends = "argon2, systemd, libcap2-bin"
maintainer-scripts = "debian"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
argon2 = "0.5.3"
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"
base64ct = "1.8.3"
blake3 = "1.8.3"
chacha20poly1305 = "0.10.1"
chrono = "0.4.43"
getrandom = "0.4.1"
hex = "0.4.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "highlighter", "svg", "tiny-skia", "tokio", "wayland"] }
libc = "0.2.180"
lz4 = "1.28.1"
percent-encoding = "2.3.2"
quick-xml = { version = "0.41", features = ["serialize"] }
reed-solomon-erasure = { version = "6.0.0", features = ["simd-accel"] }
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha3 = "0.10.8"
zeroize = "1.8.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0
