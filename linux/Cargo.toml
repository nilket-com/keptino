[package]
name = "keptino"
version = "0.2.2"
edition = "2024"
authors = ["nilket.com"]
description = "A password vault by nilket."

[package.metadata.deb]
maintainer = "nilket.com"
copyright = "2026, nilket.com"
license-file = ["../LICENSE", "0"]
provides = "digisafe"
conflicts = "digisafe"
replaces = "digisafe"
assets = [
    ["target/release/keptino", "/usr/bin/keptino", "755"],
    ["debian/digisafe", "/usr/bin/digisafe", "755"],
    ["keptino.png", "/usr/share/pixmaps/keptino.png", "644"],
    ["keptino.desktop", "/usr/share/applications/keptino.desktop", "644"],
]
depends = "systemd, libcap2-bin"
maintainer-scripts = "debian"

[features]
# Only android/interop enables these. `harness` finds systemd-creds through
# PATH so the test harness can stand in for the TPM. `write-format-2` writes
# the marked AAD form to regenerate those fixtures; `write-unmarked` names
# the default mirrored form and changes nothing.
harness = []
write-format-2 = []
write-unmarked = []

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64ct = "1.8.3"
blake3 = { version = "1.8.3", features = ["pure"] }
getrandom = "0.4.1"
hex = "0.4.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "svg", "tiny-skia", "tokio", "wayland"] }
libkeptino = { path = "../libkeptino", features = ["fido", "s3"] }
jiff = "1.0.1"
landlock = "0.4"
libc = "0.2.180"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
zbus = { version = "6", default-features = false, features = ["tokio"] }
zeroize = "1.8.2"

[dev-dependencies]
libkeptino = { path = "../libkeptino", features = ["test-support"] }
