# Advisories accepted for this build, each with the reason and the condition
# under which it leaves this list. `cargo audit` in setup.sh reads this file,
# so a new advisory is still reported while these stay quiet. Review the list
# whenever a dependency below is upgraded.
[advisories]
ignore = [
	# rustybuzz (via resvg in iced_tiny_skia) and ttf-parser (via fontdb in
	# cosmic-text) are pinned by iced 0.14; both only shape and parse the
	# bundled UI fonts and icons, never vault content. Drop at the next iced
	# release that moves to their maintained successors.
	"RUSTSEC-2026-0206",
	"RUSTSEC-2026-0192",
	# lru 0.16 is listed in Cargo.lock only through cryoglyph, iced's GPU
	# text renderer, which this tiny-skia build never links (`cargo tree -i
	# lru@0.16.4 --target all` is empty). Drop when iced stops listing it.
	"RUSTSEC-2026-0253",
]
