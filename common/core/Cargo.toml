[package]
name = "keptino-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Keptino vault format, cryptography and sync policy, shared by the Linux and Android heads."

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
blake3 = "1.8.3"
chacha20poly1305 = "0.10.1"
getrandom = "0.4.1"
keptino-erasure = { path = "../erasure" }
lz4 = "1.28.1"
sha3 = "0.10.8"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
