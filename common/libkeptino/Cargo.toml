[package]
name = "libkeptino"
version = "0.1.0"
edition = "2024"
publish = false
description = "What the Keptino heads share: the vault format, cryptography, sync policy and erasure code, with security keys behind the fido feature and S3 signing behind s3."

[features]
default = []
fido = ["dep:aes", "dep:cbc", "dep:hkdf", "dep:hmac", "dep:p256", "dep:sha2"]
s3 = ["dep:hmac", "dep:sha2"]
test-support = ["fido"]

[dependencies]
aes = { version = "0.8.4", optional = true }
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
blake3 = "1.8.3"
cbc = { version = "0.1.2", optional = true }
chacha20poly1305 = "0.10.1"
getrandom = "0.4.1"
hkdf = { version = "0.12.4", optional = true }
hmac = { version = "0.12.1", optional = true }
lz4 = "1.28.1"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "getrandom"], optional = true }
sha2 = { version = "0.10.9", optional = true }
sha3 = "0.10.8"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
