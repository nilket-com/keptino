[package]
name = "keptino-fido"
version = "0.1.0"
edition = "2024"
publish = false
description = "CTAP2 for Keptino security keys: framing, canonical CBOR, PIN protocols and the enroll and assert ceremonies, with no I/O."

[features]
test-support = []

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
getrandom = "0.4.1"
hkdf = "0.12.4"
hmac = "0.12.1"
keptino-core = { path = "../core" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "getrandom"] }
sha2 = "0.10.9"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
