[package]
name = "droid"
version = "0.2.0"
edition = "2024"
authors = ["nilket.com"]
description = "Keptino vault core for Android."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.4.1"
jni = { version = "0.21.1", default-features = false }
libkeptino = { path = "../../common/libkeptino", features = ["fido", "s3"] }
libc = "0.2.191"
zeroize = "1.8.2"

[dev-dependencies]
hex = "0.4.3"
libkeptino = { path = "../../common/libkeptino", features = ["test-support"] }
